<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8a64"/>
      <stop offset="1" stop-color="#04473a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fa77b"/>
      <stop offset="1" stop-color="#0c7a58"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="230" y="290" width="740" height="580" rx="72"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#00261d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Artwork shifted so the card and badge together sit centred -->
  <g transform="translate(-60 -65)">

  <!-- Photo card -->
  <g filter="url(#shadow)">
    <rect x="230" y="290" width="740" height="580" rx="72" fill="#ffffff"/>
  </g>
  <g clip-path="url(#photo)">
    <rect x="230" y="290" width="740" height="580" fill="#e8f6f0"/>
    <circle cx="410" cy="455" r="70" fill="#ffc453"/>
    <path d="M230 870 L230 720 L450 520 L620 690 L720 600 L970 800 L970 870 Z" fill="url(#hill)"/>
    <path d="M230 870 L230 790 L520 680 L760 760 L970 720 L970 870 Z" fill="#0a6a4d"/>
  </g>

  <!-- Check badge, ringed in the background colour so it separates from the card -->
  <circle cx="900" cy="850" r="190" fill="#05503f"/>
  <circle cx="900" cy="850" r="160" fill="#ffc453"/>
  <path d="M828 852 L880 904 L978 800" fill="none" stroke="#05503f" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
